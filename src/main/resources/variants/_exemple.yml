# ============================================================
#  Modèle de variants et de meneurs (ce fichier n'est jamais chargé : il commence par « _ »)
# ============================================================
#  Copier dans un fichier sans « _ » (ex. squelettes.yml), puis /etermob reload. Identifiant : [a-z0-9_-], à ne jamais
#  changer une fois en jeu (il est écrit sur le mob). Où et quand il sort : config.yml > spawns.
#
#  type       mob de Minecraft (SKELETON, ZOMBIE, SPIDER...) ; n'importe quel mob, même au corps à corps pour un squelette
#  tier       variant | meneur (sous-boss : à la tête d'un groupe, followers)
#  rarity     commun | peu-commun | rare | epique | legendaire (budget d'équilibrage : /etermob list)
#  stats      health, damage, speed (× ceux du mob, puis × le ratio sauf la vitesse), armor (+), knockback-resistance,
#             tenacity (part des contrôles ignorée), scale (taille)
#  equipment  main-hand, off-hand, helmet, chestplate, leggings, boots (jamais lâché)
#  ai         range, focus { threat, proximity, finish, ranged, healer, tank }, sticky, switch-seconds,
#             global-cooldown, threshold, anti-cheese (voir AiProfile)
#  abilities  briques : kind + réglages (/etermob info <id> montre leur valeur)
#             communs : id, trigger (active, on-hit, on-damaged, on-death, below-health, periodic), cooldown, cast
#             (télégraphe, s), range [min, max], sight, weight, chance, below, damage, radius, knockback, lift,
#             states ["état puissance secondes [chance]"] (bleed, burn, stun, root, slow, freeze, fragile, weakness,
#             mark, silence, fear, taunt)
#             sortes : strike, slam, leap, charge, volley, pull, curse, blink, pillar, aura, heal, call, evade, burst,
#             summon
#  loot       [{ item, amount: [min, max], chance, min-ratio, tag }] ; xp : en plus
#  followers  (meneur) { variants: { id: poids }, size: [min, max] }

variants:
  squelette-garde:
    type: SKELETON
    tier: variant
    rarity: peu-commun
    name: "Garde d'os"
    lore: ["Il préfère le contact à l'arc."]
    stats: { health: 1.4, damage: 1.2, speed: 1.05, armor: 4, tenacity: 0.1 }
    equipment: { main-hand: IRON_SWORD, helmet: CHAINMAIL_HELMET }
    ai:
      focus: { proximity: 1.0, finish: 0.6 }
    abilities:
      - kind: strike
        chance: 0.25
        damage: 2
        states: ["bleed 1 4"]
      - kind: charge
        cooldown: 14
        damage: 5
        states: ["slow 0.3 2"]
    loot:
      - { item: BONE, amount: [1, 3], chance: 0.6 }
      - { item: IRON_NUGGET, amount: [2, 5], chance: 0.3, min-ratio: 3 }
    xp: 5

  squelette-archer:
    type: SKELETON
    rarity: commun
    name: "Archer d'os"
    stats: { health: 1.1 }
    ai:
      focus: { ranged: 0.6, healer: 0.6, proximity: 0.2 }
    abilities:
      - kind: volley
        count: 3
        spread: 6
        damage: 3
      - kind: evade
        chance: 0.3
        states: ["slow 0.2 2"]

  capitaine-os:
    type: WITHER_SKELETON
    tier: meneur
    rarity: rare
    name: "Capitaine d'os"
    stats: { health: 2.2, damage: 1.3, armor: 6, tenacity: 0.25, scale: 1.15 }
    equipment: { main-hand: STONE_AXE }
    ai:
      focus: { threat: 1.2, healer: 0.8, ranged: 0.5 }
    abilities:
      - kind: call
      - kind: pillar
        mode: spike
        block: BONE_BLOCK
        damage: 6
        states: ["root 1 1.5"]
      - kind: slam
        radius: 4
        damage: 6
        states: ["fragile 0.25 5"]
      - kind: heal
        below: 0.4
        amount: 0.15
    followers:
      variants: { squelette-garde: 2, squelette-archer: 1 }
      size: [2, 4]
    loot:
      - { item: BONE_BLOCK, amount: [1, 2], chance: 0.8 }
      - { item: EMERALD, amount: [1, 3], chance: 0.4 }
    xp: 25
