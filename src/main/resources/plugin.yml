name: EterMob
version: '${version}'

main: fr.eternom.eterMob.Main
api-version: '26.2'
load: POSTWORLD
authors: [ NadTum ]
description: Variants de mobs avec capacités, apparition selon le lieu, ratio de puissance.

commands:
  etermob:
    description: Variants de mobs et boss (liste, apparition de test, suppression des boss).
    usage: /etermob <list|spawn <variant> [ratio]|boss <id|list|remove [numéro|all]>>
    permission: etermob.admin

permissions:
  etermob.admin:
    description: Lister les variants, en faire apparaître pour les tester, faire apparaître et supprimer les boss.
    default: op
