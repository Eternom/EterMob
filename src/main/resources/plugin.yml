name: EterMob
version: '${version}'

main: fr.eternom.eterMob.Main
api-version: '26.2'
load: POSTWORLD
authors: [ NadTum ]
description: Monstres du réseau (variants, meneurs, boss) avec capacités, IA de ciblage, apparition automatique et ratios de puissance.
depend: [EterLib]
softdepend: [BetterModel, EterJob]

commands:
  etermob:
    description: Variants, meneurs et boss (liste, apparition de test, inspection, équilibrage, règles, événements).
    usage: /etermob <menu|list|info|spawn|inspect|debug|clear|balance|rules|event|reload|boss|anim>
    permission: etermob.use
  bestiary:
    description: "Le bestiaire : les monstres rencontrés, leurs rangs et leur butin."
    usage: /bestiary
    aliases: [bestiaire]
    permission: etermob.bestiary

permissions:
  etermob.bestiary:
    description: /bestiary.
    default: true
  etermob.use:
    description: Ouvre /etermob (chaque partie demande sa permission).
    default: op
  etermob.spawn:
    description: Faire apparaître des variants et des boss pour les tester, retirer les monstres autour de soi.
    default: op
  etermob.debug:
    description: Inspecter un monstre (IA, menace, capacités), voir les règles d'apparition, l'équilibrage.
    default: op
  etermob.admin:
    description: Tout EterMob (rechargement, événements, suppression des boss).
    default: op
    children:
      etermob.use: true
      etermob.spawn: true
      etermob.debug: true
